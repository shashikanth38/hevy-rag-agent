version: 2

models:
  - name: weekly_volume
    description: "Weekly training volume per muscle group per gym"
    columns:
      - name: week_start
        tests:
          - not_null
      - name: primary_muscle
        tests:
          - not_null
      - name: total_sets
        tests:
          - not_null

  - name: pr_tracking
    description: "Personal records per exercise per gym"
    columns:
      - name: exercise_title
        tests:
          - not_null
      - name: gym_detail
        tests:
          - name: gym_detail
        tests:
          - not_null:
              config:
                severity: warn
      - name: max_weight_kg
        tests:
          - not_null

  - name: fatigue_index
    description: "7d vs 28d rolling tonnage ratio"
    columns:
      - name: workout_date
        tests:
          - not_null
      - name: fatigue_index
        tests:
          - not_null