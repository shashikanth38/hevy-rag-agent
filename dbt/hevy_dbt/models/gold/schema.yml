version: 2

models:
  - name: fct_training_day
    description: >
      One row per calendar day including rest days. Acute:chronic workload
      ratio over 7 vs 28 CALENDAR days. Answers "should I rest?".
    columns:
      - name: workout_date
        tests: [not_null, unique]
      - name: is_training_day
        tests: [not_null]
      - name: daily_tonnage
        tests: [not_null]
      - name: fatigue_index
        tests: [not_null]
      - name: training_status
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['optimal', 'overreaching', 'undertraining', 'insufficient_data']

  - name: fct_training_week
    description: >
      One row per week. push/pull/leg balance derived from the
      muscle_landmarks movement_group. Answers "is my split balanced?".
    columns:
      - name: week_start
        tests: [not_null, unique]
      - name: total_sets
        tests: [not_null]
      - name: push_pull_status
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['balanced', 'push_dominant', 'pull_dominant', 'no_pull_training']
      - name: quad_ham_status
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['balanced', 'quad_dominant_injury_risk', 'hamstring_dominant', 'no_hamstring_training']

  - name: fct_muscle_week
    description: >
      One row per (week, muscle) for every muscle in muscle_landmarks,
      including untrained ones. Answers "am I doing enough for X?".
    columns:
      - name: week_start
        tests: [not_null]
      - name: muscle
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('muscle_landmarks')
                field: muscle
      - name: movement_group
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['push', 'pull', 'legs', 'core', 'other']
      - name: direct_sets
        tests: [not_null]
      - name: effective_sets
        tests: [not_null]
      - name: volume_status
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['optimal', 'below_mev', 'above_mav', 'above_mrv', 'not_trained', 'not_tracked']

  - name: fct_exercise_progression
    description: >
      One row per (exercise, gym_detail, workout_date). Gym is in the grain
      because machine loads are not comparable between venues.
      Answers "am I getting stronger?".
    columns:
      - name: workout_date
        tests: [not_null]
      - name: exercise_title
        tests: [not_null]
      - name: gym_detail
        tests: [not_null]
      - name: estimated_1rm
        tests: [not_null]
      - name: is_cross_gym_comparable
        tests: [not_null]
      - name: progression_trend
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['improving', 'plateauing', 'declining', 'insufficient_data']

seeds:
  - name: muscle_landmarks
    description: >
      Weekly volume landmarks (MEV/MAV/MRV) and push/pull/leg classification
      per muscle. Editing this CSV is how you retune thresholds or add a
      muscle — no SQL change required.
    columns:
      - name: muscle
        tests: [not_null, unique]
      - name: movement_group
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['push', 'pull', 'legs', 'core', 'other']
